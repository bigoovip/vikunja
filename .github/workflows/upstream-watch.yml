name: Upstream watch (build patched image)

# 自动跟上游：每天检查 go-vikunja/vikunja 的最新 release，把 patches/series 套到它的源码上，
# 跑测试，通过就构建出**候选镜像** <上游tag>-tz.<n>（不可变 tag）。
#
# 它**不碰生产**：浮动别名 tz 只由 promote.yml（推 v* tag）移动。
# 无新版本时静默退出，不发通知。

on:
  schedule:
    - cron: '15 0 * * *'          # 08:15 CST，每天一次
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 tag（留空 = GitHub 最新 release）'
        required: false
        default: ''
      release:
        description: '本次产物 tag（留空 = <上游tag>-tz.1）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.r.outputs.upstream }}
      release: ${{ steps.r.outputs.release }}
      build: ${{ steps.r.outputs.build }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: r
        env:
          IN_TAG: ${{ inputs.upstream_tag }}
          IN_REL: ${{ inputs.release }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          up="${IN_TAG}"
          if [ -z "$up" ]; then
            # 匿名调用在 Actions 共享 IP 上会被 403 限流，必须带 token
            up=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
                 https://api.github.com/repos/go-vikunja/vikunja/releases/latest | jq -r .tag_name)
          fi
          if [ -z "$up" ] || [ "$up" = "null" ]; then echo "::error::cannot resolve upstream release"; exit 1; fi
          rel="${IN_REL:-${up}-tz.1}"
          echo "upstream=$up  release=$rel"
          # 无状态判断：这个上游版本已经出过任何 <上游tag>-tz.* 镜像就跳过。
          # （不能只查 <up>-tz.1：人工 dispatch 出过 -tz.2 之后，日常巡检不该再补一个 -tz.1）
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" | jq -r .token)
          have=$(curl -fsS -H "Authorization: Bearer ${tok}" \
                 "https://ghcr.io/v2/${REPO}/tags/list?n=1000" | jq -r '.tags[]?' | grep -c "^${up}-tz\." || true)
          if [ "${have:-0}" -gt 0 ] && [ -z "${IN_REL}" ]; then
            echo "ghcr.io/${REPO} already has ${have} image(s) for upstream ${up} — nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "ghcr.io/${REPO}:${rel}" >/dev/null 2>&1; then
            echo "image ghcr.io/${REPO}:${rel} already exists — nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream=$up" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"

  build:
    name: Patch + test + build ${{ needs.resolve.outputs.release }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM: ${{ needs.resolve.outputs.upstream }}
      RELEASE: ${{ needs.resolve.outputs.release }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5          # 本仓库 main：patches/ + 这个 workflow
        with:
          fetch-depth: 1

      - name: Stage the patch series
        run: cp -r patches/series /tmp/patches

      - name: Rebase the patches onto the upstream release
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/go-vikunja/vikunja.git
          git fetch --depth=1 upstream "refs/tags/${UPSTREAM}:refs/tags/${UPSTREAM}"
          git checkout -B "build/${RELEASE}" "${UPSTREAM}"
          git -c user.name=ci -c user.email=ci@localhost am -3 /tmp/patches/*.patch

      # 守卫目的是防「main 上直接改了源码却没重新生成 patches/series」。
      # 判据：main 的 pkg/ 必须等于「补丁基线 tag + 补丁序列」。
      # 基线写在 patches/base（单行上游 tag），而不是拿当前 UPSTREAM 比 ——
      # 上游一发新版，main 的 pkg/（旧基线）必然与新 UPSTREAM 不同，
      # 拿 UPSTREAM 比会把「上游升版」误判成「补丁漂移」（2026-10-21 v2.7.1 踩过）。
      - name: Guard — main must equal patches/base + the patch series
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < patches/base)
          if [ -z "$base" ]; then
            echo "::error::patches/base 为空，必须写一行补丁基线上游 tag（如 v2.7.0）"
            exit 1
          fi
          echo "patch baseline: ${base}"
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/go-vikunja/vikunja.git
          git fetch --depth=1 upstream "refs/tags/${base}:refs/tags/${base}"
          cp -r patches/series /tmp/patches-base
          git checkout -B "guard/${base}" "${base}"
          git -c user.name=ci -c user.email=ci@localhost am -3 /tmp/patches-base/*.patch
          git fetch --depth=1 origin main
          if ! git diff --quiet FETCH_HEAD -- pkg/; then
            echo "::error::main 的 pkg/ 与 patches/base(${base}) + patches/series 不一致：改了源码就要重新生成补丁序列（并同步 patches/base）"
            git diff --stat FETCH_HEAD -- pkg/
            exit 1
          fi
          echo "main == ${base} + patches/series (pkg/)"
          # 守卫换了分支，切回已打好补丁的构建分支（不要重建！否则工作区是未打补丁的上游源码）
          git checkout "build/${RELEASE}"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: go vet + test the patched packages
        run: |
          go vet ./pkg/caldav/ ./pkg/routes/caldav/
          go test ./pkg/caldav/ ./pkg/routes/caldav/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_VERSION=${{ needs.resolve.outputs.release }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: |
          docker buildx imagetools inspect "ghcr.io/${REPO}:${RELEASE}" | sed -n '1,8p'

      # 包默认私有 Komodo 就拉不到；新版本沿用包级设置，这里再兜一次（幂等）。
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          PKG="${PKG:-vikunja}"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/pkg.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${PKG}" \
              -d '{"visibility":"public"}')
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then exit 0; fi
            cat /tmp/pkg.json || true
            sleep 15
          done
          echo "::warning::could not set package visibility; set it by hand in Packages → ${PKG} → settings"
