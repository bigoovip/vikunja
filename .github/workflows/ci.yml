name: CI (tests only)

# main 分支只跑测试，不构建、不推镜像。
# 构建走 upstream-watch.yml（跟上游 release），上线走 promote.yml（推 v* tag）。

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests (caldav)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: go vet + test the patched packages
        run: |
          go vet ./pkg/caldav/ ./pkg/routes/caldav/
          go test ./pkg/caldav/ ./pkg/routes/caldav/
